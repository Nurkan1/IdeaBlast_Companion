name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            label: windows
          # Linux (works on Kali, Ubuntu, Debian, etc.)
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            label: linux

    runs-on: ${{ matrix.platform }}
    steps:
      # Third-party actions are pinned to commit SHAs (not tags) so a hijacked
      # tag cannot inject malicious code into our release pipeline.
      # When updating, bump both the SHA and the trailing `# vX` comment.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "IdeaBlast Companion ${{ github.ref_name }}"
          releaseBody: |
            ## IdeaBlast Companion ${{ github.ref_name }}

            The native desktop AI assistant for [IdeaBlast](https://ideablast.app).
            Connects your local AI models (Ollama) to IdeaBlast via MCP.

            ### Highlights
            - 💾 **Persistent conversations** — pick a local folder, auto-saved as JSON
            - 🗂 **Searchable history sidebar** with rename / delete / export to Markdown
            - 🎨 **Light & Dark themes** with one-click toggle
            - 📝 **Markdown rendering** with tables, code blocks and GFM
            - ✨ Glassmorphism UI, smooth animations, keyboard shortcuts (`Ctrl+N`, `Ctrl+S`)
            - 🔌 Full IdeaBlast MCP integration preserved — nothing leaves your machine

            ### Downloads
            - **Windows**: `.exe` installer (recommended) or `.msi`
            - **Linux**: `.deb` (Debian/Ubuntu/Kali) or `.AppImage` (universal)

            ### Quick Start
            1. Install [Ollama](https://ollama.ai) and pull a model: `ollama pull gemma3:4b`
            2. Install IdeaBlast Companion (download below)
            3. Open [IdeaBlast](https://ideablast.app), enable MCP Sync
            4. Open Companion — it connects automatically!
          releaseDraft: false
          prerelease: false
