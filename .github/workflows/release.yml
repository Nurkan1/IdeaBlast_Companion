name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            label: windows
          # Linux (works on Kali, Ubuntu, Debian, etc.)
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            label: linux

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "IdeaBlast Companion ${{ github.ref_name }}"
          releaseBody: |
            ## IdeaBlast Companion ${{ github.ref_name }}

            The native desktop AI assistant for [IdeaBlast](https://ideablast.app).
            Connects your local AI models (Ollama) to IdeaBlast via MCP.

            ### Downloads
            - **Windows**: `.exe` installer (recommended) or `.msi`
            - **Linux**: `.deb` (Debian/Ubuntu/Kali) or `.AppImage` (universal)

            ### Quick Start
            1. Install [Ollama](https://ollama.ai) and pull a model: `ollama pull gemma3:4b`
            2. Install IdeaBlast Companion (download below)
            3. Open [IdeaBlast](https://ideablast.app), enable MCP Sync
            4. Open Companion — it connects automatically!
          releaseDraft: false
          prerelease: false
