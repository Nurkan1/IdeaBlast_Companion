[package]
name = "ideablast-companion"
version = "0.1.0"
description = "IdeaBlast Companion - Local AI Desktop App"
authors = ["you"]
edition = "2021"

[lib]
name = "ideablast_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
